name: api-ci

on:
  push:
    paths:
      - 'apps/api/**'
      - 'scripts/smoke-api.sh'
      - '.github/workflows/api-ci.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'scripts/smoke-api.sh'
      - '.github/workflows/api-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: motorcycle
          POSTGRES_PASSWORD: motorcycle
          POSTGRES_DB: motorcycle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U motorcycle -d motorcycle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Local CI Postgres only. Not a Supabase host, project ref, or secret.
      DATABASE_URL: postgresql://motorcycle:motorcycle@localhost:5432/motorcycle
      DIRECT_URL: postgresql://motorcycle:motorcycle@localhost:5432/motorcycle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm run build
      - name: Smoke test
        env:
          # Unit tests + build already ran above; smoke focuses on migrate + HTTP.
          SMOKE_SKIP_UNIT: '1'
          SMOKE_SKIP_BUILD: '1'
          ALLOW_DEMO_OAUTH: 'true'
        run: bash ../../scripts/smoke-api.sh
