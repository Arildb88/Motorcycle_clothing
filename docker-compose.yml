version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: motorcycle
      POSTGRES_PASSWORD: motorcycle
      POSTGRES_DB: motorcycle
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://motorcycle:motorcycle@postgres:5432/motorcycle
      JWT_SECRET: change-me-in-staging
      WEATHER_PROVIDER: met
      MET_USER_AGENT: MotorcycleClothingApp/0.1 (staging)
      NODE_ENV: staging
    depends_on:
      - postgres
      - redis
volumes:
  pgdata:
