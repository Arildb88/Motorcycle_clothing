name: motorcycle_clothing
description: "RideWear — personalized outdoor clothing recommendations."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  http: ^1.6.0
  provider: ^6.1.5+1
  # 11.2.0 still sets compileSdk from flutter.compileSdkVersion.
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  google_mobile_ads: ^9.1.0
  intl: any
  uuid: ^4.6.0
  google_fonts: ^9.0.0
  flutter_web_auth_2: ^5.1.0
  geolocator: ^14.1.1
  # Already locked transitively. Direct so attribution links can open Fnugg.
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
